<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background-color: #f4f4f9; display: flex; justify-content: center; }
        .caja-login { background: white; padding: 40px; border-radius: 10px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0 20px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;}
        button:hover { background-color: #004494; }
    </style>
</head>
<body>
    <div class="caja-login">
        <h2></h2>
        
        {% if form.errors %}
            <p style="color: red;">Usuario o contraseña incorrectos.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <label align="left" style="display:block;">Usuario:</label>
            {{ form.username }}
            
            <label align="left" style="display:block;">Contraseña:</label>
            {{ form.password }}
            
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
